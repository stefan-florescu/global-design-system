version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      react-next:
        patterns: ["react", "react-dom", "@types/react*", "next", "@next/*"]
      mdx-docs:
        patterns: ["@next/mdx", "@mdx-js/*", "shiki", "remark-*", "rehype-*", "next-themes"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*", "prettier-plugin-tailwindcss", "tailwind-merge"]
      tooling:
        patterns:
          [
            "eslint*",
            "@eslint/*",
            "typescript-eslint",
            "prettier",
            "turbo",
            "vitest",
            "@vitest/*",
            "tsup",
            "vite",
          ]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
